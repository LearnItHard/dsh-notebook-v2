# dsh-notebook-v2 bundle patch
#
# 按**包名**挂进 profile：Loader 拥有一个 entry，dsh-client-modules 才扫得到本包的
# dsh.client，客户端 bundle 才会被编进 boot graph（页面拿得到 /plugins/dsh-notebook-v2/client.js）。
#
# 依赖：本包必须出现在 profile package.json 的 `dsh.profile.bundles` 里，这条 patch 才会应用。
# 关掉 v2（回滚）= 把下面 enabled 改 false，或把包名从 bundles 数组移除；旧插件与 .ipynb 不受影响。
- insert:
    - id: dsh-notebook-v2
      name: dsh-notebook-v2
      config:
        enabled: true
        # 可选：设置后 /nb2/* 需要 ?token=… 或 x-nb2-token 头（默认空 = 不校验；
        # 宿主只绑 127.0.0.1，本机进程可达，目前不校验）。
        token: ''
        # 内核解释器。留空 = 自动探测：envsel 里该会话的选择（含父会话继承）
        #   → conda 环境里第一个装了 ipykernel 的 → PATH 上的 python。
        # 在 notebook 工具栏的「内核」下拉里切换是会话级的，等价且不用重启应用。
        python: ''
        # 内核初始工作目录。留空 = 工作区根目录；工具栏点「工作目录」可改（会重启内核）。
        cwd: ''
        # 启动即预热内核：3s 左右的冷启动与「写第一格」重叠，点运行就不用等。
        eager: true
        # AI 内联建议（Mod-K）与 nb_apply_suggestion 用的 provider/model。
        # 留空则自动解析：宿主默认模型服务 → 第一个有模型的 provider。
        # 本机 profile 的 agent-default-model 是 quota-auto / deepseek-v4.1-flash。
        ai:
          provider: quota-auto
          model: deepseek-v4.1-flash
